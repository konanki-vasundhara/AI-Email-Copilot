version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ai_email_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ai_email_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_email_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./ai-email-copilot/backend
      dockerfile: Dockerfile
    container_name: ai_email_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/ai_email_copilot
      DATABASE_URL_SYNC: postgresql://postgres:postgrespassword@db:5432/ai_email_copilot
      REDIS_URL: redis://redis:6379/0
      TOKEN_ENCRYPTION_KEY: dGhpcy1pcy1hLXRlc3Qta2V5LTMyLWJ5dGVzLWxvbmctISE=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

